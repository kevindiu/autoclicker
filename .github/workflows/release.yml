name: Build and Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: auto-windows.exe
          - os: macos-latest
            asset_name: auto-macos.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyautogui dearpygui

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --noconsole --collect-all dearpygui --name auto-windows autoclicker.py
          Move-Item dist/auto-windows.exe ./

      - name: Build macOS Application Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --collect-all dearpygui --name auto-macos autoclicker.py
          cd dist
          zip -r ../auto-macos.zip auto-macos.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/auto-windows.exe
            release_assets/auto-macos.zip
          generate_release_notes: true
