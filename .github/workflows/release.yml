name: Build and Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: auto-windows.exe
          - os: macos-latest
            asset_name: auto-macos.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject Git Tag Version
        run: |
          python -c "import sys; v = sys.argv[1].strip() if len(sys.argv) > 1 and sys.argv[1].strip() else 'dev'; open('VERSION', 'w', encoding='utf-8').write(v)" "${{ github.ref_name }}"

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          $params = @(
            "--onefile",
            "--noconsole",
            "--clean",
            "--noupx",
            "--icon=app.ico",
            "--add-data=app.ico;.",
            "--add-data=VERSION;.",
            "--exclude-module=PIL",
            "--exclude-module=Pillow",
            "--exclude-module=pymsgbox",
            "--exclude-module=pytweening",
            "--exclude-module=mouseinfo",
            "--exclude-module=sqlite3",
            "--exclude-module=unittest",
            "--exclude-module=email",
            "--exclude-module=http",
            "--exclude-module=xml",
            "--exclude-module=xmlrpc",
            "--exclude-module=pydoc",
            "--exclude-module=doctest",
            "--exclude-module=test",
            "--exclude-module=tkinter.test",
            "--exclude-module=asyncio",
            "--exclude-module=concurrent",
            "--exclude-module=multiprocessing",
            "--exclude-module=lib2to3",
            "--name=auto-windows",
            "autoclicker.py"
          )
          pyinstaller @params
          Move-Item dist/auto-windows.exe ./

      - name: Build macOS Application Bundle
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --clean \
            --icon=app.icns \
            --add-data "app.ico:." \
            --add-data "app.png:." \
            --add-data "VERSION:." \
            --exclude-module PIL \
            --exclude-module Pillow \
            --exclude-module pymsgbox \
            --exclude-module pytweening \
            --exclude-module mouseinfo \
            --exclude-module sqlite3 \
            --exclude-module unittest \
            --exclude-module email \
            --exclude-module http \
            --exclude-module xml \
            --exclude-module xmlrpc \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module test \
            --exclude-module tkinter.test \
            --exclude-module asyncio \
            --exclude-module concurrent \
            --exclude-module multiprocessing \
            --exclude-module lib2to3 \
            --name auto-macos autoclicker.py
          cd dist
          zip -r ../auto-macos.zip auto-macos.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/auto-windows.exe
            release_assets/auto-macos.zip
          generate_release_notes: true
